name: CodeMender PR Review & Inline Suggestions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: codemender-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: CodeMender PR Security Review
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
      GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT || secrets.GCP_WIF_SERVICE_ACCOUNT }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}

    steps:
      # 1. Checkout PR head branch with full history to compare branch diffs
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      # 2. Identify modified source files and service directories in this PR
      - name: Identify Changed Source Files & Services
        id: filter
        run: |
          echo "==> Comparing branch HEAD against base: origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}"...HEAD | grep -E '\.(js|py|go|ts|jsx|tsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No supported source files (js, py, go, ts) modified in this PR."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found modified source files:"
            echo "$CHANGED_FILES"
            FILES_STRING=$(echo "$CHANGED_FILES" | tr '\n' ' ')
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "files=$FILES_STRING" >> "$GITHUB_OUTPUT"

            # Extract distinct service root directories (e.g. services/web-portal)
            CHANGED_SERVICES=$(echo "$CHANGED_FILES" | grep -E '^services/[^/]+' | cut -d/ -f1,2 | sort -u || true)
            if [ -z "$CHANGED_SERVICES" ]; then
              CHANGED_SERVICES=$(echo "$CHANGED_FILES" | xargs -n1 dirname | sort -u || true)
            fi
            SERVICES_STRING=$(echo "$CHANGED_SERVICES" | tr '\n' ' ')
            echo "Target services to scan: $SERVICES_STRING"
            echo "services=$SERVICES_STRING" >> "$GITHUB_OUTPUT"
          fi

      # 3. Informative Note if No Code Files Changed
      - name: Informative Note if No Code Changed
        if: steps.filter.outputs.has_files != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : null;
            if (!pull_number) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number,
              body: '## 🛡️ CodeMender Security Review\n\nℹ️ **No application source code files (`.js`, `.py`, `.go`, `.ts`) were modified in this PR.** Automated security review was skipped.'
            });

      # 4. Authenticate to Google Cloud via Workload Identity Federation (Keyless / OIDC)
      - name: Authenticate to Google Cloud (WIF / Keyless)
        if: steps.filter.outputs.has_files == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
          export_environment_variables: true
          create_credentials_file: true

      # 5. Set up Cloud SDK
      - name: Set up Cloud SDK
        if: steps.filter.outputs.has_files == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # 6. Install CodeMender CLI (cm)
      - name: Download & Install CodeMender CLI
        if: steps.filter.outputs.has_files == 'true'
        run: |
          echo "==> Downloading CodeMender CLI binary..."
          curl -sSL -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          rm -f cm-linux-amd64.zip
          cm --version || true

      # 7. Initialize CodeMender Workspace with sandbox disabled
      - name: Initialize CodeMender Workspace
        if: steps.filter.outputs.has_files == 'true'
        run: |
          echo "==> Initializing .codemender configuration..."
          cm init

          for cfg in "$HOME/.codemender/config.yaml" ".codemender/config.yaml"; do
            if [ -f "$cfg" ]; then
              ruby -ryaml -e '
                path = ARGV[0]
                data = YAML.load_file(path) || {}
                data["sandbox"] ||= {}
                data["sandbox"]["enabled"] = false
                File.write(path, YAML.dump(data))
              ' "$cfg" 2>/dev/null || sed -i 's/enabled: true/enabled: false/g' "$cfg" 2>/dev/null || true
            fi
          done

          cm init --verify

      # 8. Scan Only Changed Services
      - name: Scan Changed Services (cm find)
        if: steps.filter.outputs.has_files == 'true'
        id: cm-scan
        run: |
          mkdir -p reports patches
          TARGET_SERVICES="${{ steps.filter.outputs.services }}"
          echo "==> Scanning modified services: $TARGET_SERVICES"

          for svc in $TARGET_SERVICES; do
            if [ -d "$svc" ]; then
              echo "--------------------------------------------------------"
              echo "==> Running CodeMender scan on service: $svc"
              echo "--------------------------------------------------------"
              cm find "$svc" --compact --unrestricted -y || true
            fi
          done

          echo "==> Exporting scan findings..."
          cm report --format json > reports/findings.json 2>/dev/null || true

          if [ ! -s reports/findings.json ] || [ "$(cat reports/findings.json | tr -d '[:space:]')" = "[]" ] || [ "$(cat reports/findings.json | tr -d '[:space:]')" = "" ]; then
            for db_path in "$HOME/.codemender/state.db" ".codemender/state.db"; do
              if [ -f "$db_path" ]; then
                sqlite3 -json "$db_path" "SELECT id as finding_id, title, file_path, severity, status, description FROM findings;" > reports/findings.json 2>/dev/null || true
                break
              fi
            done
          fi

          echo "Exported raw findings count: $(jq 'if type=="array" then length else (.findings // [] | length) end' reports/findings.json 2>/dev/null || echo 0)"

      # 9. Deduplicate Findings & Synthesize Fixes (Fast PR: cm fix directly, no cm verify)
      - name: Deduplicate & Synthesize Fixes (cm fix)
        if: steps.filter.outputs.has_files == 'true'
        id: cm-remediate
        run: |
          FINDINGS_JSON="reports/findings.json"
          mkdir -p reports patches

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Deduplicate findings by (normalized file path + title)
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("reports/findings.json")) {
              fs.writeFileSync("reports/dedup_findings.json", "[]");
              process.exit(0);
            }
            let rawData;
            try {
              rawData = JSON.parse(fs.readFileSync("reports/findings.json", "utf8"));
            } catch (e) {
              rawData = [];
            }
            const list = Array.isArray(rawData) ? rawData : (rawData.findings || []);
            const seen = new Set();
            const unique = [];
            for (const f of list) {
              const normPath = (f.file_path || f.file || "").replace(/^.*(services\/.*)$/, "$1");
              const normTitle = (f.title || f.type || "").trim().toLowerCase();
              const key = `${normPath}::${normTitle}`;
              if (!seen.has(key) && normTitle) {
                seen.add(key);
                unique.push({
                  id: f.id || f.finding_id,
                  title: f.title || f.type || "Security Flaw",
                  file_path: normPath,
                  severity: f.severity || "UNKNOWN",
                  description: f.description || f.hypothesis || ""
                });
              }
            }
            fs.writeFileSync("reports/dedup_findings.json", JSON.stringify(unique, null, 2));
            console.log(`Deduplicated findings: ${list.length} raw -> ${unique.length} unique.`);
          '

          FINDING_IDS=$(jq -r '.[].id' reports/dedup_findings.json 2>/dev/null | grep -v '^$' || true)
          REVIEW_DATA="[]"

          for fid in $FINDING_IDS; do
            echo "--------------------------------------------------------"
            echo "Processing Finding ID: $fid"
            echo "--------------------------------------------------------"

            ITEM=$(jq -c --arg id "$fid" '.[] | select(.id == $id)' reports/dedup_findings.json | head -n 1)
            TITLE=$(echo "$ITEM" | jq -r '.title')
            FILE_PATH=$(echo "$ITEM" | jq -r '.file_path')
            SEVERITY=$(echo "$ITEM" | jq -r '.severity')
            DESC=$(echo "$ITEM" | jq -r '.description')

            FIX_STATUS="SKIPPED"

            echo "==> Synthesizing fix with: cm fix $fid"
            if cm fix "$fid" --unrestricted --bypass-warning -y; then
              if ! git diff --quiet || [ -n "$(git status --porcelain -uno)" ]; then
                git add -u
                git commit -m "fix(security): resolve $fid ($TITLE)"
                FIX_STATUS="✅ Fix Synthesized"
              else
                FIX_STATUS="⚠️ No diff produced"
              fi
            else
              FIX_STATUS="❌ Fix Failed"
            fi

            ENTRY=$(jq -n \
              --arg id "$fid" \
              --arg title "$TITLE" \
              --arg file "$FILE_PATH" \
              --arg severity "$SEVERITY" \
              --arg desc "$DESC" \
              --arg fstatus "$FIX_STATUS" \
              '{id: $id, title: $title, file_path: $file, severity: $severity, description: $desc, fix_status: $fstatus}')

            REVIEW_DATA=$(echo "$REVIEW_DATA" | jq --argjson entry "$ENTRY" '. + [$entry]')
          done

          # Save structured review data
          jq -n --argjson findings "$REVIEW_DATA" '{findings: $findings}' > reports/review_data.json

          # Generate unified diff of all patches against base branch
          git diff "origin/${{ github.base_ref }}"...HEAD > reports/codemender-changes.patch 2>/dev/null || true

      # 10. Post PR Review: Comment 1 (Detailed Findings) & Comment 2 (Inline Suggestions)
      - name: Post PR Review & Inline Suggestions
        if: steps.filter.outputs.has_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runReview = require('./.github/scripts/post-pr-review.js');
            await runReview({ github, context, core });

      # 11. Upload Review Artifacts
      - name: Upload PR Review Artifacts
        if: always() && steps.filter.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codemender-pr-review-${{ github.event.pull_request.number }}
          path: |
            reports/
            .codemender/logs/
          retention-days: 7
